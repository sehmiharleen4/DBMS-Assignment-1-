# Both engines get the same CPU/RAM budget so the comparison is fair.
# Adjust the limits to your laptop, then WRITE THE VALUES IN THE PAPER (Section V).
services:
  postgres:
    image: postgres:16
    container_name: g9_postgres
    environment:
      POSTGRES_USER: g9
      POSTGRES_PASSWORD: g9pass
      POSTGRES_DB: g9
    ports: ["5432:5432"]
    shm_size: 1g
    cpus: 4
    mem_limit: 6g
    command: ["postgres", "-c", "shared_buffers=2GB", "-c", "work_mem=64MB",
              "-c", "effective_cache_size=4GB"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  neo4j:
    image: neo4j:5.26-community
    container_name: g9_neo4j
    environment:
      NEO4J_AUTH: neo4j/g9password123
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 2G
    ports: ["7474:7474", "7687:7687"]
    cpus: 4
    mem_limit: 6g
    volumes: ["neodata:/data"]

volumes:
  pgdata:
  neodata:
